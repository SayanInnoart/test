name: Manage AWS EC2 Instance

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Start or Stop the instance'
        required: true
        type: choice
        options:
          - start
          - stop

env:
  AWS_INSTANCE_ID: 'i-0bdc1309e200b5b26'  # Replace with your instance ID
  AWS_REGION: 'ap-south-1'                # Replace with your region

jobs:
  control-instance:
    name: Control EC2 Instance
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Start Instance
      if: ${{ github.event.inputs.action == 'start' }}
      run: |
        aws ec2 start-instances --instance-ids ${{ env.AWS_INSTANCE_ID }}
        echo "Instance starting..."
        # Wait for the instance to be fully started
        while true; do
          STATUS=$(aws ec2 describe-instances --instance-ids ${{ env.AWS_INSTANCE_ID }} --query "Reservations[0].Instances[0].State.Name" --output text)
          if [ "$STATUS" = "running" ]; then
            echo "Instance is now running."
            break
          fi
          echo "Instance status: $STATUS"
          sleep 10
        done

    - name: Stop Docker Containers and Stop Instance
      if: ${{ github.event.inputs.action == 'stop' }}
      run: |
        # Send SSM command to stop Docker containers
        echo "Stopping Docker containers..."
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ env.AWS_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["docker ps -q || echo NO_CONTAINERS", "if [ $(docker ps -q | wc -l) -gt 0 ]; then docker stop $(docker ps -q); else echo No containers to stop; fi"]' \
          --query "Command.CommandId" \
          --output text \
          --region ${{ env.AWS_REGION }})

        # Wait for the command to complete and fetch its output
        echo "Waiting for Docker containers to stop..."
        aws ssm wait command-executed \
          --command-id $COMMAND_ID \
          --instance-id ${{ env.AWS_INSTANCE_ID }} \
          --region ${{ env.AWS_REGION }}

        # Check the SSM command output for errors
        echo "Command Output:"
        aws ssm get-command-invocation \
          --command-id $COMMAND_ID \
          --instance-id ${{ env.AWS_INSTANCE_ID }} \
          --region ${{ env.AWS_REGION }}

        # Stop the EC2 instance
        echo "Stopping EC2 instance..."
        aws ec2 stop-instances --instance-ids ${{ env.AWS_INSTANCE_ID }}

        # Wait for instance to stop
        while true; do
          STATUS=$(aws ec2 describe-instances --instance-ids ${{ env.AWS_INSTANCE_ID }} --query "Reservations[0].Instances[0].State.Name" --output text)
          if [ "$STATUS" = "stopped" ]; then
            echo "Instance is now stopped."
            break
          fi
          echo "Instance status: $STATUS"
          sleep 10
        done
